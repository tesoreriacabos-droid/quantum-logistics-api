services:
  - type: web
    name: quantum-logistics-api-2
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python main.py"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PUBLIC_BASE_URL
        value: https://quantum-logistics-api-2.onrender.com
      - key: EXPECTED_CURRENCY
        value: usd
      - key: STRIPE_CHECKOUT_MODE
        value: payment
