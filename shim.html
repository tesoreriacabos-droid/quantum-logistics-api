 *    Complex components (timeline, sequence, stepper, pros-cons, hero, HUD,

/* Global font rendering quality + themed surface backdrop.
 * background/color MUST be set here (SSoT) so the widget backdrop follows the
 * light/dark surface token deterministically. Without this, a widget whose
 * model-generated markup forgets `background: var(--surface)` on its root
 * container falls back to the browser-default white body, producing a broken
 * dark mode (light header/chart area behind a dark card). Regression source:
 * batch1 PB-A02 dark. */
html, body {
  background: var(--body-bg, transparent) !important;
  color: var(--on-surface) !important;
  /* Auto-resizing iframe: content grows the frame, never scrolls the document.
   * Model widgets already emit this; declared here as the SSoT default. */
  overflow-y: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-optical-sizing: auto;
  text-rendering: optimizeLegibility;
}

.widget-container {
  width: 100% !important;
  max-width: 100% !important;
  padding-inline: 0 !important;
  box-sizing: border-box;
}

/* ============================================================
 * SCROLLBAR DISCIPLINE (single source of truth)
 *   Long lists/cards flow and let the iframe auto-resize (see the C++
 *   NeutralizeInnerScroll pass, which removes accidental tiny scroll boxes).
 *   For LEGITIMATE overflow that remains (wide tables, code, pan-containers,
 *   large >=240px viewports) render a slim, theme-aware scrollbar.
 *   One token carries the correct light/dark contrast (the auto-flipped
 *   stroke token is too dark on #0f0f0f), referenced once = SSoT.
 * ============================================================ */
:root { --lumi-scrollbar-thumb: rgba(0, 0, 0, 0.20); }
:root[data-theme="dark"], body.dark-mode { --lumi-scrollbar-thumb: rgba(255, 255, 255, 0.20); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --lumi-scrollbar-thumb: rgba(255, 255, 255, 0.20); }
}
* {
  scrollbar-width: thin;
  scrollbar-color: var(--lumi-scrollbar-thumb) transparent;
}
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background-color: var(--lumi-scrollbar-thumb);
  border-radius: var(--lumi-sys-shape--full, 999px);
}

/* --- Buttons --- */
/* Universal button fallback (element specificity 0,0,1) — beats `* { padding: 0 }`
   author resets (0,0,0) while still yielding to any author class selector (0,1,0). */
button {
  appearance: none;
  -webkit-appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--lumi-sys-spacing--xs, 6px);
  min-height: 36px;
  padding: 6px 16px;
  font-family: var(--ff-sans, 'Google Sans Flex', 'Google Sans', sans-serif);
  font-size: 13px;
  font-weight: 500;
  line-height: 18px;
  color: var(--on-surface, #000000);
  background-color: var(--surface-bright, #ffffff);
  border: 1px solid var(--stroke-default, #e3e3e3);
  border-radius: var(--lumi-sys-shape--full, 999px);
  cursor: pointer;
  user-select: none;
  box-sizing: border-box;
  transition: background-color 0.15s, color 0.15s, border-color 0.15s;
}
button:hover {
  background-color: var(--surface-container-high, #e6e6e6);
}
button.active, button.is-active, button.selected, button.is-selected, button[aria-pressed="true"], button[aria-selected="true"] {
  background-color: var(--accent-container, #dcf1ff);
  color: var(--accent-fixed, #3186ff);
  border-color: transparent;
}

<script id="lumi-os-theme-init">
(function() {
  function syncBody() {
    var dt = document.documentElement.getAttribute('data-theme');
    if (document.body && (dt === 'dark' || dt === 'light')) {
      document.body.classList.toggle('dark-mode', dt === 'dark');
    }
  }
  function syncTheme(theme) {
    if (theme !== 'dark' && theme !== 'light') return;
    document.documentElement.setAttribute('data-theme', theme);
    syncBody();
  }
  if (typeof MutationObserver === 'function') {
    new MutationObserver(syncBody).observe(document.documentElement, {
      attributes: true, attributeFilter: ['data-theme']
    });
  }
  if (typeof document.addEventListener === 'function') {
    document.addEventListener('DOMContentLoaded', syncBody);
  }
  try {
    var mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
    if (mq) {
      var cur = document.documentElement.getAttribute('data-theme');
      if (!cur) {
        syncTheme(mq.matches ? 'dark' : 'light');
      } else {
        syncTheme(cur);
      }
      if (mq.addEventListener) {
        mq.addEventListener('change', function(e) {
          syncTheme(e.matches ? 'dark' : 'light');
        });
      }
    }
  } catch (e) {}
  window.addEventListener('message', function(e) {
    if (e.data && (e.data.type === 'set-theme' || e.data.type === 'APPLY_THEME') && e.data.theme) {
      syncTheme(e.data.theme);
    }
  });
})();
</script>

<body>
  <div class="widget-container">
    <div class="widget-header">
      <h2 class="widget-title">NIST SP 800-171 — Responsabilidad Compartida</h2>
      <p class="widget-subtitle">AWS GovCloud (Infraestructura) vs. Aplicación Motor Cuántico</p>
    </div>

    <div class="kpi-row">
      <div class="kpi-card">
        <span class="kpi-label">Total Evaluado</span>
        <div class="kpi-value-group">
          <span class="kpi-value">71</span>
          <span class="kpi-subtext">controles</span>
        </div>
      </div>
      <div class="kpi-card">
        <span class="kpi-label">AWS GovCloud</span>
        <div class="kpi-value-group">
          <span class="kpi-value">36</span>
          <span class="kpi-subtext">(50.7%)</span>
        </div>
      </div>
      <div class="kpi-card">
        <span class="kpi-label">Aplicación/Usuario</span>
        <div class="kpi-value-group">
          <span class="kpi-value">35</span>
          <span class="kpi-subtext">(49.3%)</span>
        </div>
      </div>
    </div>

    <div class="widget-viewport">
      <div class="chart-inner" id="chart-zone">
        <canvas id="nistChart" width="684" style="display: block; box-sizing: border-box; height: 266px; width: 684px;" height="266"></canvas>
      </div>
    </div>

    <div class="lumi-chart-legend" id="chartLegend">
      <div class="lumi-legend-item" id="legend-aws" onclick="toggleDataset(0)">
        <span class="lumi-legend-dot" id="dot-aws" style="background-color: rgb(37, 117, 252);"></span>
        <span class="lumi-legend-label">Heredados (AWS GovCloud)</span>
      </div>
      <div class="lumi-legend-item" id="legend-app" onclick="toggleDataset(1)">
        <span class="lumi-legend-dot" id="dot-app" style="background-color: rgb(91, 110, 158);"></span>
        <span class="lumi-legend-label">Aplicación / Config. Usuario</span>
      </div>
    </div>
  </div>

  <script>
    let chartInstance = null;

    function getLumiChartTokens() {
      const cs = getComputedStyle(document.documentElement);
      return {
        fontFamily: cs.getPropertyValue('--ff-sans').trim() || "'Google Sans Flex', sans-serif",
        monoFamily: cs.getPropertyValue('--ff-mono').trim() || "'Google Sans Code', monospace",
        textColor: cs.getPropertyValue('--on-surface').trim() || '#000000',
        deEmphasisColor: cs.getPropertyValue('--on-surface-variant').trim() || 'rgba(0,0,0,0.55)',
        gridColor: cs.getPropertyValue('--stroke-default').trim() || 'rgba(0,0,0,0.08)',
        surfaceColor: cs.getPropertyValue('--surface-bright').trim() || cs.getPropertyValue('--surface').trim() || '#ffffff',
        series: [
          cs.getPropertyValue('--chart-1').trim() || '#2575fc',
          cs.getPropertyValue('--chart-2').trim() || '#5b6e9e',
        ]
      };
    }

    const nistData = [
      { code: 'AC', name: 'Access Control', aws: 8, app: 8 },
      { code: 'AU', name: 'Audit & Accountability', aws: 4, app: 5 },
      { code: 'CM', name: 'Configuration Mgmt', aws: 5, app: 4 },
      { code: 'IA', name: 'Identification & Auth', aws: 5, app: 6 },
      { code: 'IR', name: 'Incident Response', aws: 1, app: 2 },
      { code: 'SC', name: 'System & Comms Prot.', aws: 10, app: 6 },
      { code: 'SI', name: 'System & Info Integrity', aws: 3, app: 4 }
    ];

    function initChart() {
      const tokens = getLumiChartTokens();
      const ctx = document.getElementById('nistChart').getContext('2d');

      // Update legend dots
      document.getElementById('dot-aws').style.backgroundColor = tokens.series[0];
      document.getElementById('dot-app').style.backgroundColor = tokens.series[1];

      Chart.defaults.font.family = tokens.fontFamily;
      Chart.defaults.color = tokens.deEmphasisColor;

      const labels = nistData.map(d => `${d.code} - ${d.name}`);
      const awsValues = nistData.map(d => d.aws);
      const appValues = nistData.map(d => d.app);

      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'Heredados (AWS GovCloud)',
              data: awsValues,
              backgroundColor: tokens.series[0],
              borderColor: tokens.surfaceColor,
              borderWidth: 1.5,
              borderRadius: { topLeft: 12, bottomLeft: 12, topRight: 0, bottomRight: 0 },
              maxBarThickness: 24,
              categoryPercentage: 0.75,
              barPercentage: 0.85
            },
            {
              label: 'Aplicación / Usuario',
              data: appValues,
              backgroundColor: tokens.series[1],
              borderColor: tokens.surfaceColor,
              borderWidth: 1.5,
              borderRadius: { topRight: 12, bottomRight: 12, topLeft: 0, bottomLeft: 0 },
              maxBarThickness: 24,
              categoryPercentage: 0.75,
              barPercentage: 0.85
            }
          ]
        },
        options: {
          indexAxis: 'y',
          responsive: true,
          maintainAspectRatio: false,
          animation: {
            duration: 600,
            easing: 'easeOutQuart'
          },
          layout: {
            padding: { top: 8, right: 16, bottom: 8, left: 4 }
          },
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: tokens.surfaceColor,
              titleColor: tokens.textColor,
              bodyColor: tokens.deEmphasisColor,
              borderColor: tokens.gridColor,
              borderWidth: 1,
              cornerRadius: 8,
              padding: 10,
              usePointStyle: true,
              callbacks: {
                title: function(items) {
                  return items[0].label;
                },
                label: function(context) {
                  const val = context.raw || 0;
                  const item = nistData[context.dataIndex];
                  const total = item.aws + item.app;
                  const pct = ((val / total) * 100).toFixed(0);
                  return ` ${context.dataset.label}: ${val} (${pct}%)`;
                },
                footer: function(items) {
                  const idx = items[0].dataIndex;
                  const item = nistData[idx];
                  return `Total Controles Familia: ${item.aws + item.app}`;
                }
              }
            }
          },
          scales: {
            x: {
              stacked: true,
              grid: { color: tokens.gridColor, drawBorder: false },
              border: { display: false },
              ticks: {
                stepSize: 4,
                padding: 8,
                font: { family: tokens.monoFamily, size: 11 },
                color: tokens.deEmphasisColor
              }
            },
            y: {
              stacked: true,
              grid: { display: false },
              border: { display: false },
              ticks: {
                padding: 8,
                font: { family: tokens.fontFamily, size: 12, weight: '500' },
                color: tokens.textColor
              }
            }
          }
        }
      });
    }

    function toggleDataset(index) {
      if (!chartInstance) return;
      const meta = chartInstance.getDatasetMeta(index);
      meta.hidden = meta.hidden === null ? !chartInstance.data.datasets[index].hidden : null;
      chartInstance.update();

      const itemEl = index === 0 ? document.getElementById('legend-aws') : document.getElementById('legend-app');
      if (meta.hidden) {
        itemEl.classList.add('is-disabled');
      } else {
        itemEl.classList.remove('is-disabled');
      }
    }

    function updateViz() {
      if (chartInstance) {
        chartInstance.destroy();
        chartInstance = null;
      }
      initChart();
    }

    function whenReady(globalName, init, zoneId, tries = 100) {
      if (typeof window[globalName] !== 'undefined') {
        Promise.resolve().then(init).catch(err => showErrorFallback(zoneId, err));
        return;
      }
      if (tries <= 0) {
        showErrorFallback(zoneId, new Error(globalName + ' failed to load'));
        return;
      }
      setTimeout(() => whenReady(globalName, init, zoneId, tries - 1), 30);
    }

    function showErrorFallback(containerId, error) {
      console.error(`Render error in ${containerId}:`, error);
      const container = document.getElementById(containerId);
      if (container) {
        if (container) container.innerHTML = `
          <div style="padding: 16px; background: var(--surface-dim); border-radius: 12px; text-align: center; color: var(--on-surface-variant);">
            <p style="margin: 0; font-size: 13px;">No se pudo cargar la visualización.</p>
          </div>`;
      }
    }

    whenReady('Chart', () => document.fonts.ready.then(initChart), 'chart-zone');

    const applyTheme = t => {
      document.documentElement.setAttribute('data-theme', t);
      if (typeof updateViz === 'function') updateViz();
    };
    if (!document.documentElement.hasAttribute('data-theme') && window.matchMedia?.('(prefers-color-scheme: dark)').matches) {
      applyTheme('dark');
    }
    window.addEventListener('message', e => {
      if (e.data?.type === 'set-theme' || e.data?.type === 'APPLY_THEME') {
        applyTheme(e.data.theme);
      }
    });

    (function autoResize() {
      function notifyHeight() {
        const c = document.querySelector('.widget-container') || document.body;
        if (!c) return;
        const h = Math.ceil(Math.max(c.getBoundingClientRect().bottom, c.scrollHeight));
        window.parent.postMessage({type: 'widget-resize', height: h}, '*');
      }
      window.addEventListener('load', () => setTimeout(notifyHeight, 120));
      new ResizeObserver(() => notifyHeight()).observe(document.querySelector('.widget-container') || document.body);
    })();
  </script>

<script>/*luminous-slider-normalizer*/(function(){function f(r){if(!r||r.type!=='range')return;var mn=parseFloat(r.min||'0'),mx=parseFloat(r.max||'100'),v=parseFloat(r.value);if(isNaN(v))v=(mn+mx)/2;var p=mx>mn?((v-mn)/(mx-mn))*100:50;r.style.setProperty('--progress',p+'%');r.style.removeProperty('--slider-fill');}function all(){document.querySelectorAll('input[type="range"], .lumi-slider').forEach(f);}document.addEventListener('input',function(e){f(e.target);});if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',all);else all();})();</script>
